name: planejapost

# Compose de produção. Variáveis de ambiente vêm do arquivo .env na mesma pasta.
#
# Domínio público: https://app.planejapost.com.br (frontend) / https://api.planejapost.com.br (API)
#
# Conexões internas (app → banco, redis, minio) usam os nomes dos containers:
#   DATABASE_URL   = postgresql://USER:PASS@planejapost-postgres:5432/DB?schema=public
#   REDIS_HOST     = planejapost-redis
#   MINIO_ENDPOINT = planejapost-minio
#
# Apenas a porta da aplicação (PORT) é exposta para o host/proxy reverso.

services:
  # ─── Aplicação ──────────────────────────────────────────────────────────────
  planejapost-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: planejapost-api
    container_name: planejapost-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    depends_on:
      planejapost-postgres:
        condition: service_healthy
      planejapost-redis:
        condition: service_healthy
      planejapost-minio:
        condition: service_started
    networks:
      - planejapost-network

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  planejapost-postgres:
    image: postgres:16-alpine
    container_name: planejapost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-planejapost}
    volumes:
      - planejapost-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-planejapost}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - planejapost-network

  # ─── Redis ───────────────────────────────────────────────────────────────────
  planejapost-redis:
    image: redis:7-alpine
    container_name: planejapost-redis
    restart: unless-stopped
    volumes:
      - planejapost-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - planejapost-network

  # ─── MinIO ───────────────────────────────────────────────────────────────────
  planejapost-minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: planejapost-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - planejapost-minio-data:/data
    # Console de administração (opcional — remova se não precisar de acesso externo)
    ports:
      - "9001:9001"
    networks:
      - planejapost-network

networks:
  planejapost-network:
    driver: bridge

volumes:
  planejapost-postgres-data:
  planejapost-redis-data:
  planejapost-minio-data:
