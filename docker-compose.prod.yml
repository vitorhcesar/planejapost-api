name: planejapost

# Compose de produção. Variáveis de ambiente vêm do arquivo .env na mesma pasta.
#
# Domínio público: https://app.planejapost.com.br (frontend) / https://api.planejapost.com.br (API)
#
# Conexões internas (app → banco, redis) usam os nomes dos containers:
#   DATABASE_URL   = postgresql://USER:PASS@planejapost-postgres:5432/DB?schema=public
#   REDIS_HOST     = planejapost-redis
#
# Apenas a porta da aplicação (PORT) é exposta para o host/proxy reverso.

services:
  # ─── Aplicação ──────────────────────────────────────────────────────────────
  planejapost-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: planejapost-api
    container_name: planejapost-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    depends_on:
      planejapost-postgres:
        condition: service_healthy
      planejapost-redis:
        condition: service_healthy
    networks:
      - planejapost-network

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  planejapost-postgres:
    image: postgres:16-alpine
    container_name: planejapost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-planejapost}
    volumes:
      - planejapost-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-planejapost}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - planejapost-network

  # ─── Redis ───────────────────────────────────────────────────────────────────
  planejapost-redis:
    image: redis:7-alpine
    container_name: planejapost-redis
    restart: unless-stopped
    volumes:
      - planejapost-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - planejapost-network

networks:
  planejapost-network:
    driver: bridge

volumes:
  planejapost-postgres-data:
  planejapost-redis-data:
