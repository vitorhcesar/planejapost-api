name: planejapost

# Compose de produção. Variáveis de ambiente vêm do arquivo .env na mesma pasta.
#
# Domínio público (SSL via Caddy):
#   Frontend: https://app.planejapost.com
#   API:      https://api.planejapost.com
#
# Conexões internas (app → banco, redis) usam os nomes dos containers:
#   DATABASE_URL = postgresql://USER:PASS@planejapost-postgres:5432/DB?schema=public
#   REDIS_HOST   = planejapost-redis
#
# Apenas o Caddy expõe portas 80/443 para o host. API, Postgres e Redis ficam na rede interna.

services:
  # ─── Reverse proxy (SSL automático) ─────────────────────────────────────────
  planejapost-caddy:
    image: caddy:2-alpine
    container_name: planejapost-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - planejapost-caddy-data:/data
      - planejapost-caddy-config:/config
    networks:
      - planejapost-network
    depends_on:
      - planejapost-api

  # ─── Aplicação ──────────────────────────────────────────────────────────────
  planejapost-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: planejapost-api
    container_name: planejapost-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      planejapost-postgres:
        condition: service_healthy
      planejapost-redis:
        condition: service_healthy
    networks:
      - planejapost-network

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  planejapost-postgres:
    image: postgres:16-alpine
    container_name: planejapost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-planejapost}
    volumes:
      - planejapost-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-planejapost}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - planejapost-network

  # ─── Redis ───────────────────────────────────────────────────────────────────
  planejapost-redis:
    image: redis:7-alpine
    container_name: planejapost-redis
    restart: unless-stopped
    volumes:
      - planejapost-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - planejapost-network

networks:
  planejapost-network:
    name: planejapost-network
    driver: bridge

volumes:
  planejapost-caddy-data:
  planejapost-caddy-config:
  planejapost-postgres-data:
  planejapost-redis-data:
