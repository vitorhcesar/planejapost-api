name: planejapost

services:
  planejapost-postgres:
    image: postgres:16-alpine
    container_name: planejapost-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planejapost
    volumes:
      - planejapost-postgres-data:/var/lib/postgresql/data

  planejapost-redis:
    image: redis:7-alpine
    container_name: planejapost-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - planejapost-redis-data:/data

volumes:
  planejapost-postgres-data:
  planejapost-redis-data:
