name: planejapost

services:
  planejapost-postgres:
    image: postgres:16-alpine
    container_name: planejapost-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planejapost
    volumes:
      - planejapost-postgres-data:/var/lib/postgresql/data

  planejapost-redis:
    image: redis:7-alpine
    container_name: planejapost-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - planejapost-redis-data:/data

  planejapost-minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: planejapost-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - planejapost-minio-data:/data

volumes:
  planejapost-postgres-data:
  planejapost-redis-data:
  planejapost-minio-data:
