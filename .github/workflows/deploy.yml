name: Deploy to VPS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VPS_DEPLOY_PATH: ~/planejapost-api

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Secrets do environment production:
      #   VPS_SSH_KEY  — chave privada SSH completa
      #   VPS_HOST     — IP ou hostname da VPS
      #   VPS_USER     — usuário SSH
      #   PROD_ENV     — conteúdo completo do prod.env (vira .env na VPS)
      - name: Create .env file
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: printf '%s\n' "$PROD_ENV" > .env

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          KEYS=$(ssh-keyscan -T 15 -t rsa,ecdsa,ed25519 "${{ secrets.VPS_HOST }}" 2>/dev/null)
          if [ -z "$KEYS" ]; then
            echo "::error::ssh-keyscan não retornou nenhuma chave. Verifique VPS_HOST (${{ secrets.VPS_HOST }})."
            exit 1
          fi
          echo "$KEYS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure deploy directory exists
        run: |
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p ${{ env.VPS_DEPLOY_PATH }}"

      - name: Sync source files to VPS
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='prod.env' \
            --exclude='generated/' \
            --exclude='.cursor/' \
            -e "ssh -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.VPS_DEPLOY_PATH }}/"

      - name: Copy .env to VPS
        run: |
          scp -o StrictHostKeyChecking=yes -o BatchMode=yes \
            .env "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.VPS_DEPLOY_PATH }}/.env"

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ${{ env.VPS_DEPLOY_PATH }} && \
             docker compose -f docker-compose.prod.yml pull --ignore-buildable && \
             docker compose -f docker-compose.prod.yml up -d --build --remove-orphans && \
             docker image prune -f"

      - name: Health check
        run: |
          echo "Aguardando aplicação inicializar..."
          sleep 15
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker inspect --format='{{.State.Health.Status}}' planejapost-api"
